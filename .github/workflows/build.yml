name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned IPA)
        run: |
          set -euo pipefail
          DERIVED="$(pwd)/build/DerivedData"
          ARCHIVE="$(pwd)/build/HouseArrest.xcarchive"
          mkdir -p "$DERIVED"

          xcodebuild archive \
            -project HouseArrest.xcodeproj \
            -scheme HouseArrest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            || true

          APP_PATH=$(find "$ARCHIVE/Products/Applications" -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$DERIVED" -name "*.app" 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            find build -type d -name "*.app" 2>/dev/null | head -20 || true
            exit 1
          fi

          IPA_DIR="$(pwd)/build/ipa_payload"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          (cd "$IPA_DIR" && zip -r -y "../HouseArrest.ipa" Payload)
          ls -lh "$(pwd)/build/HouseArrest.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HouseArrest-unsigned
          path: build/HouseArrest.ipa
          if-no-files-found: error

      - name: Create draft release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (unsigned IPA)
          draft: true
          files: build/HouseArrest.ipa
          body: |
            Unsigned IPA from `${{ github.ref_name }}`.
            Sign with enterprise certificate before installing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
