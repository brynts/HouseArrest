name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Decode AppIcon
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          folder = Path("HouseArrest/Assets.xcassets/AppIcon.appiconset")
          raw = (folder / "AppIcon.png.b64").read_text().strip()
          (folder / "AppIcon.png").write_bytes(base64.b64decode(raw))
          print("wrote", folder / "AppIcon.png")
          PY

      - name: Recolor AppIcon to mint
        run: |
          python3 - <<'PY'
          import binascii
          import struct
          import zlib
          from pathlib import Path

          path = Path("HouseArrest/Assets.xcassets/AppIcon.appiconset/AppIcon.png")

          def paeth(a, b, c):
              p = a + b - c
              pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
              if pa <= pb and pa <= pc:
                  return a
              if pb <= pc:
                  return b
              return c

          def read_chunks(data):
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              pos = 8
              chunks = []
              while pos < len(data):
                  length = struct.unpack(">I", data[pos:pos + 4])[0]
                  ctype = data[pos + 4:pos + 8]
                  cdata = data[pos + 8:pos + 8 + length]
                  chunks.append((ctype, cdata))
                  pos += 12 + length
                  if ctype == b"IEND":
                      break
              return chunks

          def unfilter(raw, width, height, bpp):
              stride = width * bpp
              out = bytearray(stride * height)
              i = 0
              prev = bytearray(stride)
              for y in range(height):
                  filt = raw[i]
                  i += 1
                  row = bytearray(raw[i:i + stride])
                  i += stride
                  if filt == 1:
                      for x in range(stride):
                          left = row[x - bpp] if x >= bpp else 0
                          row[x] = (row[x] + left) & 255
                  elif filt == 2:
                      for x in range(stride):
                          row[x] = (row[x] + prev[x]) & 255
                  elif filt == 3:
                      for x in range(stride):
                          left = row[x - bpp] if x >= bpp else 0
                          row[x] = (row[x] + ((left + prev[x]) // 2)) & 255
                  elif filt == 4:
                      for x in range(stride):
                          left = row[x - bpp] if x >= bpp else 0
                          up = prev[x]
                          ul = prev[x - bpp] if x >= bpp else 0
                          row[x] = (row[x] + paeth(left, up, ul)) & 255
                  elif filt != 0:
                      raise ValueError(f"unsupported PNG filter {filt}")
                  out[y * stride:(y + 1) * stride] = row
                  prev = row
              return out

          def write_png(width, height, rgb):
              stride = width * 3
              raw = bytearray()
              for y in range(height):
                  raw.append(0)
                  raw.extend(rgb[y * stride:(y + 1) * stride])
              ihdr = struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0)

              def chunk(tag, payload):
                  crc = binascii.crc32(tag + payload) & 0xFFFFFFFF
                  return struct.pack(">I", len(payload)) + tag + payload + struct.pack(">I", crc)

              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", ihdr)
                  + chunk(b"IDAT", zlib.compress(bytes(raw), 9))
                  + chunk(b"IEND", b"")
              )

          data = path.read_bytes()
          chunks = read_chunks(data)
          ihdr = next(payload for tag, payload in chunks if tag == b"IHDR")
          width, height, bit, color_type, *_ = struct.unpack(">IIBBBBB", ihdr)
          if bit != 8 or color_type != 2:
              raise SystemExit(f"unsupported PNG {width}x{height} bit={bit} type={color_type}")
          raw = zlib.decompress(b"".join(payload for tag, payload in chunks if tag == b"IDAT"))
          pixels = unfilter(raw, width, height, 3)
          src_house = bytes((232, 168, 74))
          src_lock = bytes((184, 122, 40))
          mint = bytes((51, 199, 184))      # #33C7B8
          mint_dark = bytes((37, 143, 132))  # #25908C
          out = bytearray(pixels)
          changed = 0
          for i in range(0, len(out), 3):
              trip = bytes(out[i:i + 3])
              if trip == src_house:
                  out[i:i + 3] = mint
                  changed += 1
              elif trip == src_lock:
                  out[i:i + 3] = mint_dark
                  changed += 1
          path.write_bytes(write_png(width, height, out))
          print(f"recolored {changed} pixels -> {path}")
          if changed == 0:
              raise SystemExit("no orange pixels found to recolor")
          PY

      - name: Build (unsigned IPA)
        run: |
          set -euo pipefail
          DERIVED="$(pwd)/build/DerivedData"
          ARCHIVE="$(pwd)/build/HouseArrest.xcarchive"
          mkdir -p "$DERIVED"

          xcodebuild archive \
            -project HouseArrest.xcodeproj \
            -scheme HouseArrest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            || true

          APP_PATH=$(find "$ARCHIVE/Products/Applications" -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$DERIVED" -name "*.app" 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            find build -type d -name "*.app" 2>/dev/null | head -20 || true
            exit 1
          fi

          IPA_DIR="$(pwd)/build/ipa_payload"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          (cd "$IPA_DIR" && zip -r -y "../HouseArrest.ipa" Payload)
          ls -lh "$(pwd)/build/HouseArrest.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HouseArrest-unsigned
          path: build/HouseArrest.ipa
          if-no-files-found: error

      - name: Create draft release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (unsigned IPA)
          draft: true
          files: build/HouseArrest.ipa
          body: |
            Unsigned IPA from `${{ github.ref_name }}`.
            Sign with enterprise certificate before installing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
